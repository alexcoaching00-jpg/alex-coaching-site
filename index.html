<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Alex Coaching</title>
<meta name="theme-color" content="#1C1512" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Alex Coaching" />
<!--
  CoachFlow (version iPad / clés dans l'appli)
  Aucune modification du fichier nécessaire.
  1) Crée un projet gratuit sur https://supabase.com
  2) SQL Editor > exécute le script (visible aussi dans l'écran Réglages de l'appli) :
       create table clients (...);  alter table clients enable row level security;  create policy ...
  3) Ouvre ce fichier, colle l'URL du projet + la clé "anon public" dans l'écran d'accueil.
-->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#0F0F0F;--ink2:#1C1C1C;--base:#141414;--card:#1E1E1E;--red:#C1121F;--red2:#9B0E18;--grey:#9E9E9E;--grey2:#616161;--line:#2A2A2A;--danger:#E53935;--white:#F0EEEC;--white2:#BDBDBD;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{background:var(--base);color:var(--white);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
  h1,h2,h3,.disp{font-family:'Bebas Neue',system-ui,sans-serif;letter-spacing:.04em}
  button{font-family:inherit}50%{transform:scale(1.05);filter:brightness(1.15)}}50%{opacity:1}}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){main{animation:none}}
  .wrap{max-width:520px;margin:0 auto;padding-bottom:92px}
  main{padding:16px 16px 0;animation:fade .3s ease both}
  .hd{background:var(--ink);border-bottom:1px solid var(--line);padding:14px 18px 16px}
  .hd-top{display:flex;align-items:center;justify-content:space-between}
  .logo{display:flex;align-items:center;gap:10px}
  .logo .mark{width:32px;height:32px;border-radius:8px;background:var(--red);display:grid;place-items:center;font-family:'Bebas Neue';font-size:18px;color:#fff;letter-spacing:.04em}
  .logo .wm{font-family:'Bebas Neue';font-size:22px;letter-spacing:.06em;color:var(--white)}
  .toggle{background:var(--ink2);border-radius:999px;padding:3px;display:flex;gap:2px;border:1px solid var(--line)}
  .toggle button{border:none;cursor:pointer;border-radius:999px;padding:6px 14px;font-family:'Inter';font-weight:600;font-size:12px;background:transparent;color:var(--grey2);transition:all .15s}
  .toggle button.on{background:var(--red);color:#fff}
  .sub{color:var(--grey2);font-size:13px;margin-top:8px}
  .pick label{color:var(--grey2);font-size:12px}
  .pick select{display:block;margin-top:4px;background:var(--ink2);color:var(--white);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15px;font-family:'Inter';font-weight:600;width:100%}
  .row-stats{display:flex;gap:12px;margin-bottom:16px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
  .stat .v{font-family:'Bebas Neue';font-size:36px;color:var(--red);line-height:1;letter-spacing:.04em}
  .stat .l{font-size:11px;color:var(--grey);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .tag.em{background:rgba(193,18,31,.18);color:#FF6B6B}
  .tag.am{background:rgba(184,134,47,.18);color:#F0B429}
  .tag.ink{background:var(--ink2);color:var(--grey)}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .sec-head h2{font-family:'Bebas Neue';font-size:20px;letter-spacing:.06em;color:var(--white)}
  .link{border:none;background:transparent;color:var(--red);font-weight:700;font-size:14px;cursor:pointer}
  .crow{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:border-color .15s}
  .crow:hover{border-color:var(--red)}
  .avatar{width:44px;height:44px;border-radius:12px;background:rgba(193,18,31,.15);display:grid;place-items:center;font-family:'Bebas Neue';font-size:20px;color:var(--red);flex-shrink:0}
  .crow .nm{font-weight:700;font-size:15px;color:var(--white)}
  .crow .ob{font-size:12.5px;color:var(--grey);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trend{font-size:12px;font-weight:700;font-family:'Inter'}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:22px;text-align:center}
  .empty .t{font-family:'Bebas Neue';font-size:20px;letter-spacing:.04em;margin-bottom:6px;color:var(--white)}
  .empty p{color:var(--grey);font-size:14px;margin-bottom:16px}
  .btn{border:none;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;font-family:'Inter';transition:filter .15s,transform .1s}
  .btn:active{transform:scale(.97)}
  .btn.p{background:var(--red);color:#fff}
  .btn.p:hover{filter:brightness(1.1)}
  .btn.d{background:var(--ink2);color:var(--white);border:1px solid var(--line)}
  .btn.g{background:transparent;color:var(--white2);border:1px solid var(--line)}
  .btn.dg{background:transparent;color:var(--danger);border:1px solid var(--danger)}
  .btn.full{width:100%}.btn[disabled]{opacity:.4;cursor:default}
  .col{display:flex;flex-direction:column;gap:8px}
  .r2{display:flex;gap:10px}.r2>div,.r2>label{flex:1}
  .back{border:none;background:transparent;color:var(--grey);font-weight:600;font-size:14px;cursor:pointer;margin-bottom:8px}
  .dhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .dhead h2{font-family:'Bebas Neue';font-size:24px;letter-spacing:.04em;color:var(--white);line-height:1.1}
  .dhead .mini{display:flex;gap:6px;margin-top:4px}
  .tabbar{display:flex;gap:3px;background:var(--ink2);border-radius:12px;padding:3px;margin-bottom:16px;border:1px solid var(--line)}
  .tabbar button{flex:1;border:none;border-radius:9px;padding:8px 4px;font-size:12px;font-weight:700;font-family:'Inter';cursor:pointer;background:transparent;color:var(--grey2);text-transform:uppercase;letter-spacing:.04em}
  .tabbar button.on{background:var(--red);color:#fff}
  .fld{display:block;margin-bottom:12px}
  .fld span{display:block;font-size:11px;font-weight:700;color:var(--grey2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
  .fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 13px;font-size:15px;background:var(--ink2);color:var(--white);outline:none;font-family:'Inter'}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--red)}
  .fld textarea{resize:vertical}
  .panel{background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:14px}
  .panel .ph{font-family:'Bebas Neue';font-size:17px;letter-spacing:.05em;margin-bottom:10px;color:var(--white)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px}
  .exi{font-family:'Bebas Neue';font-size:14px;color:var(--red);letter-spacing:.06em}
  .exn{font-weight:700;font-size:15px;color:var(--white)}
  .exd{font-size:13px;color:var(--grey);margin-top:4px}
  .exnote{font-size:12.5px;color:#FF6B6B;margin-top:4px;font-style:italic}
  .x{border:none;background:transparent;color:var(--grey2);cursor:pointer;font-size:18px;line-height:1;padding:4px}
  .mrow{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 13px;margin-bottom:8px}
  .mrow .mv{font-family:'Bebas Neue';font-size:18px;color:var(--white);letter-spacing:.04em}
  .mrow .md{color:var(--grey);font-size:12.5px;margin-left:8px}
  .srow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px}
  .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:transparent;color:#fff;cursor:pointer;font-weight:800;font-size:14px;flex-shrink:0;transition:all .15s}
  .chk.on{background:var(--red);border-color:var(--red)}
  .muted{color:var(--grey);font-size:14px}
  .cbanner{background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;border-radius:18px;padding:18px;margin-bottom:16px}
  .cbanner .lab{font-size:11px;color:rgba(255,255,255,.7);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
  .cbanner .obj{font-family:'Bebas Neue';font-size:20px;margin-top:4px;letter-spacing:.04em}
  .chartbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 12px;margin-bottom:14px}
  .chart-empty{border-radius:14px;padding:20px;text-align:center;background:var(--ink2);color:var(--grey);border:1px dashed var(--line);font-size:14px}
  nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:var(--ink);border-top:1px solid var(--line);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  nav button{flex:1;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--grey2);font-family:'Inter';font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;transition:color .15s}
  nav button.on{color:var(--red)}nav .ic{font-size:18px;line-height:1}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:60}
  .sheet{background:var(--ink2);border:1px solid var(--line);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px;max-height:88vh;overflow-y:auto;animation:fade .25s ease both}
  .sheet .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .sheet h2{font-family:'Bebas Neue';font-size:22px;letter-spacing:.04em;color:var(--white)}
  .toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;padding:8px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:50;letter-spacing:.02em}
  .danger-box{border:1px solid var(--danger);border-radius:12px;padding:12px;background:rgba(229,57,53,.08)}
  .danger-box p{font-size:13px;margin-bottom:10px;color:var(--white2)}
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:var(--base)}
  .authcard{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}
  .authcard .lead{color:var(--grey);font-size:14px;margin:2px 0 18px}
  .autherr{background:rgba(229,57,53,.15);color:#FF6B6B;border:1px solid rgba(229,57,53,.3);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
  .switch{text-align:center;margin-top:14px;font-size:13.5px;color:var(--grey)}
  .switch button{border:none;background:transparent;color:var(--red);font-weight:700;cursor:pointer;font-family:'Inter'}
  .logo-img{display:block;width:100%;max-width:300px;margin:0 auto 20px;border-radius:16px;box-shadow:0 8px 32px rgba(193,18,31,.25)}
  code{background:var(--ink2);color:var(--white2);padding:1px 5px;border-radius:5px;font-size:13px}
  .sql{white-space:pre-wrap;background:#0A0A0A;color:#666;padding:12px;border-radius:10px;font-size:11px;line-height:1.45;overflow:auto;margin-top:8px;font-family:ui-monospace,Menlo,monospace}
  details summary{cursor:pointer;font-size:13.5px;color:var(--red);font-weight:700}
</style>
</head>

const CFG_KEY="coachflow:cfg";
function loadCfg(){ try{ return JSON.parse(localStorage.getItem(CFG_KEY)||"null"); }catch(e){ return null; } }
function saveCfg(c){ try{ localStorage.setItem(CFG_KEY,JSON.stringify(c)); }catch(e){} }

const SQL=`create table clients (
  id uuid primary key default gen_random_uuid(),
  coach_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
  nom text not null, objectif text, formule text, niveau text, notes text,
  client_email text,
  date_debut date,
  program jsonb default '[]'::jsonb,
  mesures jsonb default '[]'::jsonb,
  seances jsonb default '[]'::jsonb,
  updated_at timestamptz default now()
);
alter table clients enable row level security;
create policy "coach gere ses clients" on clients
  for all using (auth.uid() = coach_id) with check (auth.uid() = coach_id);
create policy "client lit sa fiche" on clients
  for select using (lower(client_email) = lower(auth.jwt() ->> 'email'));
create policy "client met a jour sa fiche" on clients
  for update using (lower(client_email) = lower(auth.jwt() ->> 'email'))
  with check (lower(client_email) = lower(auth.jwt() ->> 'email'));`;

const rowToClient=r=>({id:r.id,nom:r.nom,objectif:r.objectif||"",formule:r.formule||FORMULES[0],niveau:r.niveau||NIVEAUX[0],notes:r.notes||"",clientEmail:r.client_email||"",dateDebut:r.date_debut||"",program:r.program||[],mesures:r.mesures||[],seances:r.seances||[]});
const clientToRow=c=>({nom:c.nom,objectif:c.objectif||null,formule:c.formule||null,niveau:c.niveau||null,notes:c.notes||null,client_email:(c.clientEmail||"").trim().toLowerCase()||null,date_debut:c.dateDebut||null,program:c.program||[],mesures:c.mesures||[],seances:c.seances||[],updated_at:new Date().toISOString()});

let toastT=null;
function toast(msg){const t=document.getElementById("toast");if(!t)return;t.textContent=msg;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>t.style.display="none",1200);}

const timers={};
function save(){const c=sel();if(!c||!sb)return;clearTimeout(timers[c.id]);timers[c.id]=setTimeout(()=>{
  sb.from("clients").update(clientToRow(c)).eq("id",c.id).then(({error})=>toast(error?"Erreur de sync":"Synchronisé"));
},350);}

async function loadClients(){
  if(!sb)return; S.loading=true; render();
  const uidNow=S.session&&S.session.user?S.session.user.id:null;

  // Charge toutes les fiches accessibles (RLS filtre automatiquement)
  const {data:allRows, error}=await sb.from("clients").select("*");
  const rows=allRows||[];

  // Fiches dont je suis le coach
  const coachRows=rows.filter(r=>r.coach_id===uidNow);
  // Fiches dont je suis le client (créées par quelqu'un d'autre)
  const clientRows=rows.filter(r=>r.coach_id!==uidNow);

  if(clientRows.length>0 && coachRows.length===0){
    // Pur client : aucune fiche créée par moi → espace client
    const mine=clientRows[0];
    S.isClient=true; S.role="client"; S.clientTab="programme";
    S.clients=[rowToClient(mine)]; S.selectedId=mine.id; S.loading=false; render(); return;
  }

  // Coach (ou compte mixte — rare) : espace coach
  S.isClient=false; S.role="coach";
  S.clients=coachRows.map(rowToClient);
  S.loading=false; render();
}

function chart(mesures){
  const pts=(mesures||[]).filter(m=>typeof m.poids==="number");
  if(pts.length<2) return `<div class="chart-empty">Ajoutez au moins deux mesures pour voir la courbe de progression.</div>`;
  const W=440,H=180,pad={l:34,r:14,t:14,b:24};
  const ys=pts.map(m=>m.poids),minY=Math.min(...ys)-1,maxY=Math.max(...ys)+1;
  const px=i=>pad.l+(i/(pts.length-1))*(W-pad.l-pad.r);
  const py=v=>pad.t+(1-(v-minY)/(maxY-minY||1))*(H-pad.t-pad.b);
  const line=pts.map((m,i)=>`${px(i).toFixed(1)},${py(m.poids).toFixed(1)}`).join(" ");
  const dots=pts.map((m,i)=>`<circle cx="${px(i).toFixed(1)}" cy="${py(m.poids).toFixed(1)}" r="4" fill="#C1121F"/>`).join("");
  const xlab=pts.map((m,i)=>`<text x="${px(i).toFixed(1)}" y="${H-6}" font-size="10" fill="#6B7770" text-anchor="middle">${frDate(m.date)}</text>`).join("");
  const grid=[0,.5,1].map(t=>{const y=pad.t+t*(H-pad.t-pad.b),v=(maxY-t*(maxY-minY)).toFixed(1);
    return `<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#DBE0D6" stroke-dasharray="3 3"/><text x="4" y="${y+3}" font-size="9" fill="#6B7770">${v}</text>`;}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Courbe de poids">${grid}<polyline points="${line}" fill="none" stroke="#C1121F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xlab}</svg>`;
}

/* ===== actions async ===== */
async function doAuth(mode){
  const email=val("au-email").trim(), pw=val("au-pw");
  if(!email||!pw){ S.authErr="Renseignez e-mail et mot de passe."; render(); return; }
  if(mode==="signup"){
    const pw2=val("au-pw2");
    if(pw!==pw2){ S.authErr="Les deux mots de passe ne correspondent pas."; render(); return; }
    if(pw.length<8){ S.authErr="Le mot de passe doit faire au moins 8 caractères."; render(); return; }
  }
  S.authErr=""; S.authBusy=true; render();
  let data, error;
  if(mode==="signup"){
    ({data,error}=await sb.auth.signUp({email,password:pw}));
    if(!error&&!data.session){ S.authBusy=false; S.authView="login"; S.authErr="Compte créé. Connectez-vous."; render(); return; }
  } else {
    ({data,error}=await sb.auth.signInWithPassword({email,password:pw}));
  }
  S.authBusy=false;
  if(error){ S.authErr=error.message; render(); return; }
}
async function inviteClient(){
  const c=sel(); if(!c) return;
  const email=(c.clientEmail||"").trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
    alert("Renseignez d'abord une adresse e-mail valide pour ce client."); return;
  }
  // 1. Enregistre l'e-mail sur la fiche
  const {error:upErr}=await sb.from("clients").update(clientToRow(c)).eq("id",c.id);
  if(upErr){ alert("Enregistrement impossible : "+upErr.message); return; }
  // 2. Appelle la Edge Function (qui utilise la clé service_role côté serveur)
  toast("Envoi en cours…");
  const {data:{session}}=await sb.auth.getSession();
  const token=session?.access_token;
  const res=await fetch(`${SUPA_URL}/functions/v1/invite-client`,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer "+token,
      "apikey": SUPA_KEY
    },
    body:JSON.stringify({clientEmail:email, clientId:c.id})
  });
  const json=await res.json();
  if(!res.ok||json.error){
    alert("Envoi impossible : "+(json.error||res.statusText)); return;
  }
  const msg=json.mode==="reset"
    ? "Un lien de connexion a été envoyé à "+email+" (compte existant)."
    : "Invitation envoyée à "+email+".\n\nIl recevra un lien pour créer son mot de passe et accéder à son espace.";
  alert(msg);
}

async function createClientFromModal(){
  const nom=val("ac-nom").trim(); if(!nom) return;

/* ===== events ===== */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act, c=sel();
  switch(a){
    case "auth-switch": S.authView=t.dataset.to; S.authErr=""; render(); break;
    case "auth-submit": doAuth(t.dataset.mode); break;
    case "logout": if(sb) sb.auth.signOut(); break;
    case "invite": inviteClient(); break;
    case "role": S.role=t.dataset.role; if(S.role==="client"&&!S.selectedId&&S.clients[0]) S.selectedId=S.clients[0].id; render(); break;
    case "nav": S.view=t.dataset.view; render(); break;
    case "nav-client": S.clientTab=t.dataset.ctab; render(); break;
    case "open": S.selectedId=t.dataset.id; S.view="detail"; S.detailTab="infos"; S.confirmDel=false; render(); break;
    case "back": S.view="clients"; render(); break;
    case "dtab": S.detailTab=t.dataset.dtab; S.confirmDel=false; render(); break;
    case "add-open": S.showAdd=true; render(); break;
    case "modal-close": S.showAdd=false; render(); break;
    case "modal-bg": if(!e.target.closest("[data-stop]")){ S.showAdd=false; render(); } break;
    case "modal-create": createClientFromModal(); break;
    case "sample": addSample(); break;
    case "del-open": S.confirmDel=true; render(); break;
    case "del-cancel": S.confirmDel=false; render(); break;
    case "del-confirm": deleteSelected(); break;
    case "add-ex":{ if(!c) return; const nom=val("ex-nom").trim(); if(!nom) return;
      c.program=c.program||[]; c.program.push({id:uid(),nom,series:+val("ex-series")||3,reps:val("ex-reps"),charge:val("ex-charge"),repos:val("ex-repos"),note:val("ex-note")});
      save(); render(); break; }
    case "del-ex": if(c){ c.program=(c.program||[]).filter(x=>x.id!==t.dataset.id); save(); render(); } break;
    case "add-me":{ if(!c) return; const p=parseFloat(String(val("me-poids")).replace(",",".")); if(isNaN(p)) return;
      c.mesures=c.mesures||[]; c.mesures.push({date:today(),poids:p,note:val("me-note")}); c.mesures.sort((x,y)=>x.date.localeCompare(y.date)); save(); render(); break; }
    case "del-me": if(c){ c.mesures=(c.mesures||[]).filter((_,i)=>i!==+t.dataset.idx); save(); render(); } break;
    case "add-se":{ if(!c) return; c.seances=c.seances||[]; c.seances.push({date:today(),fait:true,ressenti:val("se-ressenti"),note:val("se-note")}); c.seances.sort((x,y)=>y.date.localeCompare(x.date)); save(); render(); break; }
    case "toggle-se": if(c){ const i=+t.dataset.idx; c.seances[i].fait=!c.seances[i].fait; save(); render(); } break;
    case "del-se": if(c){ c.seances=(c.seances||[]).filter((_,i)=>i!==+t.dataset.idx); save(); render(); } break;
    case "export":{
      const payload={app:"Alex Coaching",version:1,exportedAt:new Date().toISOString(),clients:S.clients};
      const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob),link=document.createElement("a");
      link.href=url; link.download=`coachflow-sauvegarde-${today()}.json`; document.body.appendChild(link); link.click(); link.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000); break; }
  }
});
document.addEventListener("input",e=>{
  const el=e.target.closest("[data-bind]"); if(!el) return;
  const c=sel(); if(!c) return; c[el.dataset.bind]=el.value; save();
});
document.addEventListener("change",e=>{
  const pick=e.target.closest('[data-act="pick-client"]');
  if(pick){ S.selectedId=pick.value; render(); return; }
  const b=e.target.closest("[data-bind]");
  if(b&&(b.dataset.bind==="formule"||b.dataset.bind==="niveau")){ const c=sel(); if(c){ c[b.dataset.bind]=b.value; save(); render(); } }
});

/* ===== boot ===== */
render();
sb.auth.onAuthStateChange((_evt,session)=>{
  S.session=session||null;
  if(session){ loadClients(); } else { S.clients=[]; S.isClient=false; render(); }
});
function bootApp(){

sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
render();
sb.auth.onAuthStateChange((_evt,session)=>{
  S.session=session||null;
  if(session){ loadClients(); } else { S.clients=[]; S.isClient=false; render(); }
});
}
bootApp();

bootApp();
</script>
